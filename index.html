<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LEVAD — Simulateur</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Simulateur">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="logo-badge"><img src="assets/logo.png" alt="LEVAD" height="30"></span>
      <span class="logo-sub">Simulateur</span>
    </div>
    <div class="topbar-right">
      <span id="user-chip" class="user-chip" hidden></span>
      <button id="users-btn" class="btn small" data-action="open-users" hidden>👥 Utilisateurs</button>
      <button id="logout-btn" class="btn small" data-action="logout" hidden>Déconnexion</button>
      <button id="theme-toggle" class="icon-btn" title="Mode clair / sombre" aria-label="Mode clair / sombre">🌙</button>
    </div>
  </header>

  <main id="screen"></main>

  <div id="users-modal" class="modal-overlay" hidden>
    <div class="modal-panel">
      <div class="card-head">
        <h2>Utilisateurs</h2>
        <div class="head-actions">
          <button class="btn" data-action="add-user">＋ Créer un utilisateur</button>
          <button class="btn ghost small" data-action="close-users">✕ Fermer</button>
        </div>
      </div>
      <div id="users-list"></div>
    </div>
  </div>

  <div id="config-modal" class="modal-overlay" hidden>
    <div class="modal-panel config-panel">
      <div id="config-body"></div>
    </div>
  </div>

  <div id="cfg-info-popup" class="cfg-info-popup" hidden>
    <button type="button" class="cfg-info-close" data-action="close-cfg-info">✕</button>
    <div id="cfg-info-text"></div>
  </div>

  <footer class="footer">
    Simulateur SA/SP &amp; générateur de proposition — fonctionne hors-ligne, aucune donnée envoyée.
  </footer>

  <!-- Librairies locales (offline) -->
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <!-- Firebase (partage en ligne ; si absent/hors-ligne, repli local) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Application -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/export-excel.js"></script>
  <script src="js/export-pptx.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return; reloaded = true; location.reload();
      });
    }
  </script>
</body>
</html>
