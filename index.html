<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LEVAD — Simulateur</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Simulateur">
  <link rel="apple-touch-icon" href="icons/levad-sim-180.png">
  <link rel="icon" href="icons/levad-sim-favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/levad-sim-favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/levad-sim-favicon-64.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="logo-badge"><img src="assets/logo.png" alt="LEVAD" height="30"></span>
    </div>
    <nav class="main-nav" id="main-nav" hidden>
      <button class="nav-link" data-action="show-simulateur" data-nav="simulateur">Simulateur</button>
      <button class="nav-link" id="portfolio-btn" data-action="toggle-portfolio" data-nav="portfolio">Portefeuille</button>
      <button class="nav-link" id="margins-btn" data-action="toggle-margins" data-nav="margins">Marges</button>
      <button class="nav-link" id="admin-btn" data-action="toggle-admin" data-nav="admin" hidden>Administration</button>
    </nav>
    <div class="topbar-right">
      <button id="theme-toggle" class="icon-btn" title="Mode clair / sombre" aria-label="Mode clair / sombre">🌙</button>
      <div class="user-menu" id="user-menu" hidden>
        <button class="user-menu-btn" id="user-menu-btn" data-action="toggle-user-menu">
          <span id="user-chip"></span>
          <span class="user-menu-caret" aria-hidden="true">▾</span>
        </button>
        <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
          <button class="user-menu-item" data-action="logout">🚪 Déconnexion</button>
        </div>
      </div>
    </div>
  </header>

  <main id="screen"></main>

  <div id="config-modal" class="modal-overlay" hidden>
    <div class="modal-panel config-panel">
      <div id="config-body"></div>
    </div>
  </div>

  <div id="date-modal" class="modal-overlay" hidden>
    <div class="modal-panel date-panel">
      <div class="card-head"><h2>Date de signature</h2></div>
      <label class="fld"><span>Date</span><input type="date" id="date-modal-input"></label>
      <label class="fld"><span>Signé</span>
        <select id="date-modal-periodicite">
          <option value="T" selected>Trimestriellement</option>
          <option value="M">Mensuellement</option>
        </select></label>
      <div class="actions">
        <button class="btn ghost small" data-action="date-modal-today">Aujourd'hui</button>
        <button class="btn primary small" data-action="date-modal-confirm">Valider</button>
        <button class="btn ghost small" data-action="date-modal-cancel">Annuler</button>
      </div>
    </div>
  </div>

  <div id="save-modal" class="modal-overlay" hidden>
    <div class="modal-panel save-panel">
      <div class="card-head"><h2>Enregistrer la simulation</h2></div>
      <p id="save-modal-text" class="muted small"></p>
      <div class="actions">
        <button class="btn primary small" data-action="save-modal-replace">↺ Remplacer l'existante</button>
        <button class="btn small" data-action="save-modal-newversion"></button>
        <button class="btn ghost small" data-action="save-modal-cancel">Annuler</button>
      </div>
    </div>
  </div>

  <div id="new-sim-modal" class="modal-overlay" hidden>
    <div class="modal-panel save-panel">
      <div class="card-head"><h2>Nouvelle simulation</h2></div>
      <div id="new-sim-modal-body"></div>
    </div>
  </div>

  <div id="cfg-info-popup" class="cfg-info-popup" hidden>
    <button type="button" class="cfg-info-close" data-action="close-cfg-info">✕</button>
    <div id="cfg-info-text"></div>
  </div>

  <footer class="footer">
    Simulateur SA/SP &amp; générateur de proposition — fonctionne hors-ligne, aucune donnée envoyée.
  </footer>

  <!-- Librairies locales (offline) -->
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <!-- Firebase (partage en ligne ; si absent/hors-ligne, repli local) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Application -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/telephonie.js"></script>
  <script src="js/export-excel.js"></script>
  <script src="js/export-pptx.js"></script>
  <script src="js/export-pptx-telephonie.js"></script>
  <script src="js/export-pdf.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return; reloaded = true; location.reload();
      });
    }
  </script>
</body>
</html>
